<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grupos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <link rel="stylesheet" href="styleGrupo.css">

</head>

<body>

    <!-- Cabeçalho -->
    <div class="usuario container-fluid py-3">
        <h3 class="ms-3">Grupos</h3>
    </div>
    <hr>

    <!-- Conteúdo -->
    <div class="container-fluid mt-4">
        <div class="row">

            <!-- Menu lateral -->
            <div id="menuLateral" class="col-lg-2 col-md-3 col-12 text-center mb-4">

                <a href="telaInicio.html">
                    <img src="início.png" class="img-fluid mb-2" alt="">
                    <p>Início</p>
                </a>
                
                <a href="telacomunidade.html">
                    <img src="comunidades.png" class="img-fluid mb-2" alt="">
                    <p>Comunidades</p>
                </a>

                <a href="telaGrupo.html">
                    <img src="grupos.png" class="img-fluid mb-2" id="grupo" alt="">
                    <p>Grupos</p>
                </a>

                <a href="">
                    <img src="biblioteca.png" class="img-fluid mb-2" alt="">
                    <p>Minha Biblioteca</p>
                </a>

                <img src="Logo trabalho.jpeg" class="logo mt-5" alt="Logo">

            </div>


            <!-- Conteúdo principal -->
            <div class="col-lg-7 col-md-9 col-12">

                <button type="button" id="criar">Criar grupo</button>
                <div id="entrarGrupo">
                    <p>Inserir código do grupo:</p>

                    <input type="text" id="codigo" maxlength="6" placeholder="Digite o código">

                    <button type="button" id="entrar">
                        Entrar
                    </button>
                </div>

                <div class="areaGrupos">

                    <!-- LISTA DE GRUPOS -->
                    <div id="meusGrupos"></div>


                    <!-- CHAT -->
                    <div id="chat">

                        <!-- CABEÇALHO -->
                        <div id="cabecalhoChat">

                            <img id="chatImagem" src="" alt="">

                            <div>
                                <h2 id="chatNome">Selecione um grupo</h2>
                                <p id="chatDescricao">
                                    Escolha um grupo para começar a conversar.
                                </p>
                            </div>

                        </div>


                        <!-- MENSAGENS -->
                        <div id="mensagens"></div>


                        <!-- CAMPO DE MENSAGEM -->
                        <div id="campoMensagem">

                            <input type="text" id="textoMensagem" placeholder="Digite uma mensagem">

                            <button type="button" id="enviar">
                                Enviar
                            </button>

                        </div>

                    </div>

                </div>

            </div>

            <div id="janelaCadastro">

                <div>
                    Nome do grupo:
                    <input type="text" id="nome">
                </div>

                <div>
                    Descrição:
                    <input type="text" id="descricao">
                </div>

                <div>
                    URL da capa do grupo:
                    <input type="url" id="imagem">
                </div>

                <button type="button" id="fechar">Fechar</button>
                <button type="button" id="salvar">Salvar</button>

            </div>

            <!-- Abrir janela de dados e edição -->
            <div id="janelaInformacoes">

                <h2>Informações do livro</h2>

                <p>Nome: <span id="infoNome"></span></p>

                <p>Descrição: <span id="infoDescricao"></span></p>

                <p>Código de entrada: <span id="infoCodigo"></span></p>

                <button id="fecharInformacoes">Fechar</button>
                <button id="editar">Editar</button>
                <button type="button" onclick="deletar()">Excluir</button>

            </div>
        </div>

</body>

<script src="scriptGrupo.js"></script>

</html>
