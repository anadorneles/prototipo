<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Janela Flutuante</title>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <style>
        #abrir {
            padding: 10px 20px;
            cursor: pointer;
        }

        .janela,
        #janelaa,
        #janelaInformacoes {
            display: none;

            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);

            width: 400px;
            padding: 30px;

            background-color: white;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);

            z-index: 10;
        }

        #fechar {
            cursor: pointer;
        }

        #livro {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }

        .livro {
            width: 180px;
        }

        .capa {
            width: 180px;
            height: 250px;
            cursor: pointer;
        }

        .capa img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 10px;
        }
    </style>
</head>

<body>

    <button id="abrirr">janela</button>
    

    

</body>

<script src="scriptInserir.js"></script>

</html>
