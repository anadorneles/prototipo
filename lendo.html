<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lendo</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <style>
        body {
            background-color: #F3DDC8;
            font-family: Arial, Helvetica, sans-serif;
        }

        #menuLateral {
            padding: 5px;
        }

        #menuLateral a {
            display: block;
            color: black;
            text-decoration: none;
            margin-bottom: 15px;
        }

        #menuLateral p {
            margin-top: 8px;
            font-weight: bold;
        }

        #menuLateral img {
            width: 80px;
        }

        #grupo {
            width: 90px;
        }

        .logo {
            width: 110px;
            border-radius: 50%;
            margin-top: 40px;
        }

        #banner {
            height: 150px;
            background-color: #7c0116;
            border: 5px solid #e0a4b0;
            border-radius: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        #textoBanner {
            color: white;
            margin: 0;
        }

        .botoes {
            width: 100px;
            background-color: #f8ccd7;
            border-radius: 20px;
        }

        #cadastrar {
            position: absolute;
            right: 20px;
        }

        .estadoLeitura {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin: 15px 0;
        }

        #biblioteca {
            border: 2px solid #7c0116;
            min-height: 220px;
            padding: 15px;
        }

        .livro {
            width: 180px;
            padding: 10px;
            cursor: pointer;
        }

        .livro img {
            width: 150px;
            height: 200px;
            object-fit: cover;
            border-radius: 10px;
        }

        #janelaInformacoes {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 400px;
            padding: 25px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
            z-index: 1000;
        }

        #janelaInformacoes button {
            padding: 9px 18px;
            margin-top: 8px;
            border: 0;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container-fluid">
        <div class="row">

            <div id="menuLateral" class="col-lg-2 col-md-3 col-12 text-center">

                <a href="telaInicio.html">
                    <img src="início.png" class="img-fluid mb-2">
                    <p>Início</p>
                </a>

                <a href="telacomunidade.html">
                    <img src="comunidades.png" class="img-fluid mb-2">
                    <p>Comunidades</p>
                </a>

                <a href="telaGrupo.html">
                    <img src="grupos.png" class="img-fluid mb-2" id="grupo">
                    <p>Grupos</p>
                </a>

                <a href="minhaBiblioteca.html">
                    <img src="biblioteca.png" class="img-fluid mb-2">
                    <p>Minha Biblioteca</p>
                </a>

                <img src="Logo trabalho.jpeg" class="logo mt-5">

            </div>

            <main class="col-lg-10 col-md-9 col-12">

                <div id="banner">
                    <h2 id="textoBanner">Lendo</h2>

                    <button type="button" class="botoes" id="cadastrar" onclick="cadastrar()">
                        Cadastrar Livro!
                    </button>
                </div>

                <div class="estadoLeitura">

                    <button type="button" class="botoes" onclick="lido()">
                        Lido
                    </button>

                    <button type="button" class="botoes" onclick="queroLer()">
                        Quero Ler
                    </button>

                    <button type="button" class="botoes" onclick="voltar()">
                        Voltar
                    </button>

                </div>

                <div id="biblioteca">
                    <div class="d-flex flex-wrap gap-3" id="livros"></div>
                </div>

                <div id="janelaInformacoes">

                    <h2>Informações do livro</h2>

                    <p>Nome: <span id="infoNome"></span></p>
                    <p>Autor: <span id="infoAutor"></span></p>
                    <p>Editora: <span id="infoEditora"></span></p>
                    <p>Páginas: <span id="infoPaginas"></span></p>
                    <p>Páginas lidas: <span id="infoPaginasLidas"></span></p>
                    <p>Gênero: <span id="infoGenero"></span></p>
                    <p>Status: <span id="infoStatus"></span></p>

                    <button id="fecharInformacoes">Fechar</button>
                    <button id="editar">Editar</button>
                    <button type="button" onclick="deletar()">Excluir</button>

                </div>

            </main>

        </div>
    </div>

    <script>
        let livroAtual = 0;

        function voltar() {
            window.location.href = "minhaBiblioteca.html";
        }

        function cadastrar() {
            window.location.href = "cadastroLivro.html";
        }

        function queroLer() {
            window.location.href = "queroLer.html";
        }

        function lido() {
            window.location.href = "lido.html";
        }

        $(document).ready(function () {
            let quantidade = parseInt(localStorage.getItem("valor")) || 0;

            for (let i = 0; i < quantidade; i++) {
                let livroJSON = localStorage.getItem("livro" + i);

                if (livroJSON) {
                    let livro = JSON.parse(livroJSON);

                    if (livro.status == "Lendo") {
                        let modelo = `
                            <div class="livro" id="livro${i}" onclick="mostrarLivro(${i})">
                                <img src="${livro.imagem}" class="img-fluid" alt="Capa do livro">
                            </div>
                        `;

                        $("#livros").append(modelo);
                    }
                }
            }

            $("#fecharInformacoes").click(function () {
                $("#janelaInformacoes").hide();
            });

            $("#editar").click(function () {
                localStorage.setItem("livroEditar", livroAtual);
                window.location.href = "cadastroLivro.html";
            });
        });

        function mostrarLivro(id) {
            livroAtual = id;

            let livroJSON = localStorage.getItem("livro" + id);

            if (livroJSON) {
                let livro = JSON.parse(livroJSON);

                $("#infoNome").text(livro.nome);
                $("#infoAutor").text(livro.autor);
                $("#infoEditora").text(livro.editora);
                $("#infoPaginas").text(livro.paginas);
                $("#infoPaginasLidas").text(livro.paginasLidas);
                $("#infoGenero").text(livro.genero);
                $("#infoStatus").text(livro.status);

                $("#janelaInformacoes").show();
            }
        }

        function deletar() {
            let resposta = confirm("Tem certeza que deseja excluir este livro?");

            if (!resposta) {
                return;
            }

            localStorage.removeItem("livro" + livroAtual);
            $("#livro" + livroAtual).remove();
            $("#janelaInformacoes").hide();

            alert("Livro excluído!");
        }
    </script>

</body>

</html>
