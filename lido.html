<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #F3DDC8;
            font-family: Arial, Helvetica, sans-serif;
        }
        
        .usuario {
            font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;
        }
        
        #menuLateral {
            padding: 5px;
        }
        
        #menuLateral a {
            display: block;
            color: black;
            text-decoration: none;
            margin-bottom: 15px;
        }
        
        #menuLateral p {
            margin-top: 8px;
            font-weight: bold;
        }
        
        #menuLateral img {
            width: 80px;
        }
        
        #grupo {
            width: 90px;
        }
        
        .logo {
            width: 110px;
            border-radius: 50%;
            margin-top: 40px;
        }
        
        #lendo {
            border: 2px solid #7c0116;
        }
        
        #titulo {
            margin: auto auto;
            color: white;
        }
        
        .livro {
            border-radius: 10px;
            max-height: 220px;
            height: 150px;
        }
        
        .progress {
            height: 25px;
            border-radius: 20px;
        }
        
        .progress-bar {
            font-weight: bold;
        }
        
        .card {
            background-color: transparent;
            border: none;
        }
        
        #banner {
            height: 150px;
            background-color: #7c0116;
            border: 5px solid #e0a4b0;
            border-radius: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        
        #textoBanner {
            color: white;
            margin: 0;
        }
        
        .botoes {
            width: 100px;
            background-color: #f8ccd7;
            border-radius: 20px;
        }
        
        .estadoLeitura {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin: 15px 0;
        }
        
        #cadastroLivro {
            position: absolute;
            right: 15px;
            bottom: 10px;
            width: 90px;
            font-size: 12px;
        }
        
        #atualizarLivro {
            position: absolute;
            right: 15px;
            bottom: 10px;
        }
        
        #atualizar {
            width: 80px;
            font-size: 12px;
        }
        
        #biblioteca {
            border: 2px solid #7c0116;
            min-height: 220px;
            position: relative;
            padding: 15px;
        }
        
        .avaliacao {
            text-align: center;
            margin-top: 5px;
        }
        
        .estrelas {
            background-color: #F3DDC8;
            border: none;
            font-size: 22px;
            padding: 0;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="container-fluid">
        <div class="row">

            <div id="menuLateral" class="col-lg-2 col-md-3 col-12 text-center">

                <a href="telacomunidade.html">
                    <img src="comunidades.png" class="img-fluid mb-2" alt="">
                    <p>Comunidades</p>
                </a>

                <a href="telaGrupo.html">
                    <img src="grupos.png" class="img-fluid mb-2" id="grupo" alt="">
                    <p>Grupos</p>
                </a>

                <a href="">
                    <img src="biblioteca.png" class="img-fluid mb-2" alt="">
                    <p>Minha Biblioteca</p>
                </a>

                <img src="Logo trabalho.jpeg" class="logo mt-5" alt="Logo">

            </div>

            <main class="col-lg-10 col-md-9 col-12">

                <div id="banner">
                    <h2 id="textoBanner">Lidos</h2>

                    <button type="button" class="botoes" id="cadastroLivro" onclick="cadastroLivro()">
                    Cadastrar livro!
                </button>
                </div>

                <div id="estadoLeitura">
                    <button type="button" id="QueroLer" class="botoes" onclick="queroLer()">
                    Quero ler
                </button>

                    <button type="button" id="lendo" class="botoes" onclick="lendo()">
                    Lendo
                </button>

                    <button type="button" id="voltar" class="botoes" onclick="voltar()">Voltar</button>
                </div>

                <div id="biblioteca">
                    <div class="card mb-4">
                        <div class="d-flex flex-wrap gap-3">
                            <div> <img src="https://m.media-amazon.com/images/I/71SYepTUsDL._AC_UF1000,1000_QL80_.jpg" class="img-fluid livro" alt="">
                                <div class="avaliacao"> <button type="button" class="estrelas" onclick="mudarestrela(1, 1)">☆</button>
                                    <button type="button" class="estrelas" onclick="mudarestrela(1, 2)">☆</button>
                                    <button type="button" class="estrelas" onclick="mudarestrela(1, 3)">☆</button>
                                    <button type="button" class="estrelas" onclick="mudarestrela(1, 4)">☆</button>
                                    <button type="button" class="estrelas" onclick="mudarestrela(1, 5)">☆</button>
                                </div>
                            </div>
                            <div> <img src="https://m.media-amazon.com/images/I/51tHMjZsH2L._SY445_SX342_ML2_.jpg" class="img-fluid livro" alt="">
                                <div class="avaliacao"> <button type="button" class="estrelas" onclick="mudarestrela(2, 1)">☆</button>
                                    <button type="button" class="estrelas" onclick="mudarestrela(2, 2)">☆</button> <button type="button" class="estrelas" onclick="mudarestrela(2, 3)">☆</button>
                                    <button type="button" class="estrelas" onclick="mudarestrela(2, 4)">☆</button>
                                    <button type="button" class="estrelas" onclick="mudarestrela(2, 5)">☆</button>
                                </div>
                            </div>
                            <div id="atualizarLivro"> <button type="button" class="botoes" id="atualizar" onclick="inserirLivro()">atualizar</button> </div>
                        </div>
                    </div>
                </div>
            </main>

        </div>
    </div>

    <script>
        function voltar() {
            window.location.href = "minhaBiblioteca.html";
        }

        function lendo() {
            window.location.href = "lendo.html";
        }

        function inserirLivro() {
            window.location.href = "inserirLivro.html"
        }

        function cadastroLivro() {
            window.location.href = "cadastroLivro.html"
        }

        function queroLer() {
            window.location.href = "queroler.html"
        }

        function mudarestrela(livro, numero) {


            let estrelas = document.querySelectorAll(
                ".avaliacao:nth-of-type(" + livro + ") .estrelas"
            );

            if (livro == 1) {
                estrelas = document.querySelectorAll(".avaliacao")[0].querySelectorAll(".estrelas");
            }

            if (livro == 2) {
                estrelas = document.querySelectorAll(".avaliacao")[1].querySelectorAll(".estrelas");
            }

            for (let i = 0; i < estrelas.length; i++) {

                if (i < numero) {
                    estrelas[i].textContent = "★";
                } else {
                    estrelas[i].textContent = "☆";
                }

            }

            localStorage.setItem("avaliacao" + livro, numero);
        }


        let avaliacao1 = localStorage.getItem("avaliacao1");

        if (avaliacao1) {
            mudarestrela(1, parseInt(avaliacao1));
        }


        let avaliacao2 = localStorage.getItem("avaliacao2");

        if (avaliacao2) {
            mudarestrela(2, parseInt(avaliacao2));
        }
    </script>

</body>

</html>
