<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Livro</title>

    <style>
        body {
            background-color: #F3DDC8;
            font-family: Arial, Helvetica, sans-serif;
        }

        .janela {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 400px;
            padding: 30px;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
        }

        .janela input,
        .janela select {
            width: 100%;
            padding: 8px;
            margin-bottom: 15px;
            box-sizing: border-box;
        }

        .janela button {
            padding: 8px 15px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="janela">
        <h2>Cadastrar Livro</h2>

        <label>Nome do livro:</label>
        <input type="text" id="nomeLivro">

        <label>Autor:</label>
        <input type="text" id="autorLivro">

        <label>Editora:</label>
        <input type="text" id="editoraLivro">

        <label>Número de páginas:</label>
        <input type="number" id="paginasLivro">

        <label>Páginas lidas:</label>
        <input type="number" id="paginasLidas">

        <label>Gênero:</label>
        <input type="text" id="generoLivro">

        <label>Status:</label>
        <select id="statusLivro">
            <option value="Lendo">Lendo</option>
            <option value="Quero Ler">Quero Ler</option>
            <option value="Lido">Lido</option>
        </select>

        <label>Imagem da capa:</label>
        <input type="text" id="imagem">

        <br><br>

        <button type="button" id="salvar">Salvar</button>
        <button type="button" id="voltar">Voltar</button>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <script>
        var cont = parseInt(localStorage.getItem("valor")) || 0;
        let livroEditar = localStorage.getItem("livroEditar");

        if (livroEditar !== null) {
            let livroJSON = localStorage.getItem("livro" + livroEditar);

            if (livroJSON) {
                let livro = JSON.parse(livroJSON);

                $("#nomeLivro").val(livro.nome);
                $("#autorLivro").val(livro.autor);
                $("#editoraLivro").val(livro.editora);
                $("#paginasLivro").val(livro.paginas);
                $("#paginasLidas").val(livro.paginasLidas);
                $("#generoLivro").val(livro.genero);
                $("#statusLivro").val(livro.status);
                $("#imagem").val(livro.imagem);
            }
        }

        $("#salvar").click(function () {
            salvar();
        });

        $("#voltar").click(function () {
            localStorage.removeItem("livroEditar");
            window.location.href = "minhaBiblioteca.html";
        });

        function salvar() {
            let nome = $("#nomeLivro").val().trim();
            let autor = $("#autorLivro").val().trim();
            let editora = $("#editoraLivro").val().trim();
            let paginas = $("#paginasLivro").val();
            let paginasLidas = $("#paginasLidas").val();
            let genero = $("#generoLivro").val().trim();
            let status = $("#statusLivro").val();
            let imagem = $("#imagem").val().trim();

            if (
                nome == "" ||
                autor == "" ||
                editora == "" ||
                paginas == "" ||
                paginasLidas == "" ||
                genero == "" ||
                imagem == ""
            ) {
                alert("Preencha todos os campos!");
                return;
            }

            let livro = {
                nome: nome,
                autor: autor,
                editora: editora,
                paginas: paginas,
                paginasLidas: paginasLidas,
                genero: genero,
                status: status,
                imagem: imagem
            };

            if (livroEditar !== null) {
                localStorage.setItem(
                    "livro" + livroEditar,
                    JSON.stringify(livro)
                );

                localStorage.removeItem("livroEditar");
                alert("Livro atualizado!");
            } else {
                localStorage.setItem(
                    "livro" + cont,
                    JSON.stringify(livro)
                );

                cont++;
                localStorage.setItem("valor", cont);
                alert("Livro cadastrado!");
            }

            if (status == "Lendo") {
                window.location.href = "lendo.html";
            } else if (status == "Quero Ler") {
                window.location.href = "queroLer.html";
            } else if (status == "Lido") {
                window.location.href = "lido.html";
            }
        }
    </script>

</body>

</html>
