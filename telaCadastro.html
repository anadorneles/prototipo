<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastre-se</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <link rel="stylesheet" href="styleCadastro.css">
</head>

<body>

    <div id="container">

        <div class="ladoImagem">
            <img class="imagem"
                src="Logo trabalho.jpeg" alt="Pessoas lendo livros">
        </div>

        <div id="cadastro">

            <h1>Bem-vindo ao MarcaPáginas</h1>

            <h3>Cadastre-se e faça parte da nossa família</h3>

            <h4>Compartilhe emoções e ideias sobre o livro que está lendo</h4>

            <div class="campo">
                <p>Informe seu e-mail</p>
                <input type="email" placeholder="E-mail" id="email">
            </div>

            <div class="campo">
                <p>Crie um nome de usuário para você</p>
                <div>
                    <input type="text" placeholder="Usuário" id="usuario">
                </div>
            </div>

            <div class="campo">
                <p>Crie uma senha de acesso</p>
                <div>
                    <input type="password" placeholder="Senha" id="senha">
                </div>
            </div>

            <button type="button" id="salvar">Iniciar jornada!</button>

        </div>

    </div>

</body>

<script src="scriptCadastro.js"></script>

</html>
