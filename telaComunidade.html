<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comunidades</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <link rel="stylesheet" href="styleComunidade.css">
</head>

<body>

    <div class="usuario container-fluid py-3">
        <h3 class="ms-3">Comunidades</h3>
    </div>

    <hr>

    <div class="container-fluid mt-4">

        <div class="row">

            <div id="menuLateral" class="col-lg-2 col-md-3 col-12 text-center mb-4">

                <a href="telaInicio.html">
                    <img src="início.png" class="img-fluid mb-2" alt="">
                    <p>Início</p>
                </a>
                
                <a href="telaComunidade.html">
                    <img src="comunidades.png" class="img-fluid mb-2" alt="">
                    <p>Comunidades</p>
                </a>

                <a href="telaGrupo.html">
                    <img src="grupos.png" class="img-fluid mb-2" id="grupo" alt="">
                    <p>Grupos</p>
                </a>

                <a href="">
                    <img src="biblioteca.png" class="img-fluid mb-2" alt="">
                    <p>Minha Biblioteca</p>
                </a>

                <img src="Logo trabalho.jpeg" class="logo mt-5" alt="Logo">

            </div>

            <div class="col-lg-7 col-md-9 col-12">

                <button type="button" id="criar">Criar comunidade</button>

                <div class="areaComunidades">

                    <div id="minhasComunidades"></div>

                    <div id="chat">

                        <div id="cabecalhoChat">

                            <img id="chatImagem" src="" alt="">

                            <div>
                                <h2 id="chatNome">Selecione uma comunidade</h2>

                                <p id="chatDescricao">
                                    Escolha uma comunidade para começar a conversar.
                                </p>
                            </div>

                        </div>

                        <div id="mensagens"></div>

                        <div id="campoMensagem">

                            <input type="text" id="textoMensagem" placeholder="Digite uma mensagem">

                            <button type="button" id="enviar">
                                Enviar
                            </button>

                        </div>

                    </div>

                </div>

            </div>

            <div id="janelaCadastro">

                <div>
                    Nome da comunidade:
                    <input type="text" id="nome">
                </div>

                <div>
                    Descrição:
                    <input type="text" id="descricao">
                </div>

                <div>
                    URL da capa da comunidade:
                    <input type="url" id="imagem">
                </div>

                <button type="button" id="fechar">Fechar</button>
                <button type="button" id="salvar">Salvar</button>

            </div>

            <div id="janelaInformacoes">

                <h2>Informações da comunidade</h2>

                <p>Nome: <span id="infoNome"></span></p>

                <p>Descrição: <span id="infoDescricao"></span></p>

                <button id="fecharInformacoes">Fechar</button>
                <button id="editar">Editar</button>
                <button type="button" onclick="deletar()">Excluir</button>

            </div>

        </div>

    </div>

    <script src="scriptComunidade.js"></script>

</body>

</html>
